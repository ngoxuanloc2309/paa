name: SynaptiX IDE CI/CD

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish SynaptiX IDE
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore SimplePLC.sln

      - name: Build Solution (Release)
        run: dotnet build SimplePLC.sln --configuration Release --no-restore

      - name: Run Automated Tests
        run: dotnet test SimplePLC.sln --configuration Release --no-build --verbosity normal

      - name: Publish Windows App (Standalone Single-File)
        shell: powershell
        run: |
          $rawRef = "${{ github.ref_name }}"
          if ($rawRef -match '^v?(\d+\.\d+(\.\d+)?)') {
              $ver = $matches[1]
          } else {
              $ver = "2.0.0"
          }
          # AssemblyVersion requires 4-part format (X.Y.Z.W)
          $asmVer = "$ver.0"
          Write-Host "Publishing SynaptiX IDE version: $ver (AssemblyVersion: $asmVer)"
          dotnet publish SimplePLC.Studio/SimplePLC.Studio.csproj --configuration Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=$ver -p:AssemblyVersion=$asmVer -p:FileVersion=$asmVer -o ./publish/win-x64

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SynaptiX-IDE-win-x64-${{ github.ref_name }}
          path: ./publish/win-x64
          overwrite: true

      - name: Publish Release to Public Repository
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          repository: hoanv-synaptix/SynaptiX-IDE-Releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: SynaptiX IDE ${{ github.ref_name }}
          body: |
            ## SynaptiX IDE ${{ github.ref_name }} — Official Release
            Phiên bản chính thức của môi trường lập trình và cấu hình thiết bị công nghiệp SynaptiX IDE.
            - **Tệp thực thi:** `SimplePLC.Studio.exe` (Windows x64 độc lập, không cần cài đặt thêm .NET runtime).
            - **Chuẩn phần cứng:** Hỗ trợ SynaptiX Industrial Controller (SPLC-AF-003).
            - **Tự động cập nhật:** Hỗ trợ kiểm tra và cập nhật tự động khi có phiên bản mới.
          files: ./publish/win-x64/*
